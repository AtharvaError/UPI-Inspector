components:
  schemas:
    AssessRequest:
      properties:
        txn_id:
          type: string
          maxLength: 64
          minLength: 6
          title: Txn Id
        payer:
          $ref: '#/components/schemas/Payer'
        payee:
          $ref: '#/components/schemas/Payee'
        amount:
          type: number
          maximum: 10000000.0
          exclusiveMinimum: 0.0
          title: Amount
        currency:
          type: string
          title: Currency
          default: INR
        note:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Note
        session:
          anyOf:
          - $ref: '#/components/schemas/Session'
          - type: 'null'
        parent_decision_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Parent Decision Id
        client_ts:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Client Ts
        locale:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Locale
      type: object
      required:
      - txn_id
      - payer
      - payee
      - amount
      title: AssessRequest
    Auth:
      properties:
        method:
          type: string
          maxLength: 16
          title: Method
        otp:
          anyOf:
          - type: string
            maxLength: 12
          - type: 'null'
          title: Otp
        key_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Id
        proof:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Proof
        biometric_ok:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Biometric Ok
      type: object
      required:
      - method
      title: Auth
    BlockCreate:
      properties:
        vpa:
          type: string
          maxLength: 120
          minLength: 5
          title: Vpa
        reason:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Reason
        report:
          type: boolean
          title: Report
          default: false
      type: object
      required:
      - vpa
      title: BlockCreate
    CallEvent:
      properties:
        call_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Call Id
        event:
          type: string
          maxLength: 16
          title: Event
        callee_phone_hash:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Callee Phone Hash
        callee_user_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Callee User Id
        caller_phone_hash:
          type: string
          maxLength: 64
          title: Caller Phone Hash
        caller_known:
          type: boolean
          title: Caller Known
          default: false
        at:
          anyOf:
          - type: number
          - type: 'null'
          title: At
        started_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Started At
        source:
          type: string
          title: Source
          default: simulated
      type: object
      required:
      - event
      - caller_phone_hash
      title: CallEvent
    CallerReport:
      properties:
        call_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Call Id
        phone:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 10
          - type: 'null'
          title: Phone
        decision_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Decision Id
        category:
          type: string
          maxLength: 8
          title: Category
          default: scam
      type: object
      title: CallerReport
